# Cap core dumps from the desktop session at 1G (soft limit).
#
# systemd raises RLIMIT_CORE to infinity by default. If core_pattern ever stops
# piping to systemd-coredump, the kernel writes plain core.<pid> files into the
# crashing process's working directory, usually $HOME. That happened in
# Nov 2026: an emulator crash and the desktop crash after it left 50G of
# core files in ~ (one was 31G).
#
# systemd-coredump also honors this limit and truncates larger dumps, but still
# logs a stack trace. Hyprland dumps are a few hundred MB and fit under it.
# The hard limit stays unlimited, so run `ulimit -c unlimited` in a shell
# when a full dump is needed.
[Manager]
DefaultLimitCORE=1G:infinity
