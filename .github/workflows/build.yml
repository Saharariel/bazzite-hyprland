---
name: Build container image
on:
  pull_request:
    branches:
      - main
  schedule:
    # Bazzite publishes stable at irregular times, so check often; the check
    # job below only builds when there is actually something new.
    - cron: '17 */2 * * *'
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
  workflow_dispatch:

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  # Never cancel a running build because a scheduled check started.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check for a new Bazzite release
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read
      actions: write  # keepalive below
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Compare with upstream
        id: check
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          source image-template.env

          # Pushes, PRs and manual runs always build.
          if [[ "${EVENT}" != "schedule" ]]; then
            echo "build=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          upstream=$(skopeo inspect --no-tags "docker://${BASE_IMAGE}" | jq -r '.Digest')
          ours=$(skopeo inspect --no-tags "docker://ghcr.io/${REPO_ORGANIZATION,,}/${IMAGE_NAME,,}:${DEFAULT_TAG}" 2>/dev/null || echo '{}')
          built_on=$(jq -r --arg l "${BASE_DIGEST_LABEL}" '.Labels[$l] // ""' <<<"${ours}")
          created=$(jq -r '.Created // "1970-01-01T00:00:00Z"' <<<"${ours}")
          age_h=$(( ( $(date +%s) - $(date -d "${created}" +%s) ) / 3600 ))

          if [[ "${upstream}" != "${built_on}" ]]; then
            build=true; reason="New Bazzite base ${upstream} (last build used ${built_on:-none})"
          elif (( age_h >= 24 )); then
            build=true; reason="Daily rebuild for Hyprland COPR and Fedora updates (last build ${age_h}h ago)"
          else
            build=false; reason="Up to date with Bazzite, last build ${age_h}h ago"
          fi
          echo "${reason}" | tee -a "${GITHUB_STEP_SUMMARY}"
          echo "build=${build}" >> "${GITHUB_OUTPUT}"

      # GitHub disables scheduled workflows in public repos after 60 days
      # without a commit. Re-enabling the workflow through the API resets that
      # timer, so updates keep flowing even if the repo is left untouched.
      - name: Keep scheduled builds alive
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api --method PUT "repos/${REPO}/actions/workflows/build.yml/enable"

  build_push:
    name: Build and push image
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-26.04

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      # These stage versions are pinned by https://github.com/renovatebot/renovate
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 #v4.0.0

      - name: Check Just Syntax
        shell: bash
        run: |
          just check

      - name: Image Name
        id: image-name
        run: |
          IMAGE_NAME=$(just image_name)

          echo "IMAGE_NAME=${IMAGE_NAME}" >> "${GITHUB_ENV}"

      - name: Default Tag
        id: gen-default-tag
        run: |
          DEFAULT_TAG=$(just generate-default-tag)

          echo "DEFAULT_TAG=${DEFAULT_TAG}" >> "${GITHUB_ENV}"

      - name: Prepare environment
        run: |
          # Lowercase the image uri https://github.com/macbre/push-to-ghcr/issues/12
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> "${GITHUB_ENV}"
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "${GITHUB_ENV}"

      # This actually builds the container image
      - name: Build Image
        id: build-image
        run: |
          just build \
            "${IMAGE_NAME}" \
            "${DEFAULT_TAG}"

      # This is optional, this provides smaller delta updates
      - name: Rechunk with rpm-ostree
        id: rechunk
        run: |
          just ostree-rechunk \
            "${IMAGE_NAME}" \
            "${DEFAULT_TAG}"

      # If you are feeling adventurous, use the new distro agnostic rechunker
      # https://github.com/coreos/chunkah
      # You can delete the Rechunk with rpm-ostree portion then if you use this
      #- name: Rechunk with Chunkah
      #  id: rechunk
      #  run: |
      #    just rechunk \
      #      ${IMAGE_NAME} \
      #      ${DEFAULT_TAG}

      - name: Generate Build Tags
        id: gen-build-tags
        run: |
          alias_tags="$(just generate-build-tags \
                        "${IMAGE_NAME}" \
                        "${DEFAULT_TAG}")"

          echo "Tags for this Action..."
          echo "${alias_tags}"
          echo "alias_tags=${alias_tags}" >> "${GITHUB_OUTPUT}"

      - name: Tag Image
        id: tag-images
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          just tag-images \
            "${IMAGE_NAME}" \
            "${DEFAULT_TAG}" \
            "${ALIAS_TAGS}"

      # These `if` statements are so that pull requests for your custom images do not make it publish any packages under your name without you knowing
      # They also check if the runner is on the default branch so that things like the merge queue (if you enable it), are going to work
      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push To GHCR
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push-image
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          set -euox pipefail
          read -ra tags <<< "${ALIAS_TAGS}"
          for tag in "${tags[@]}"; do
            podman push --digestfile=/tmp/digestfile "${IMAGE_NAME}:${tag}" "${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}"
          done

          digest=$(< /tmp/digestfile)

          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      # This section is optional and only needs to be enabled if you plan on distributing
      # your project for others to consume. You will need to create a public and private key
      # using Cosign and save the private key as a repository secret in Github for this workflow
      # to consume. For more details, review the image signing section of the README.
      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          # be careful when upgrading major versions
          cosign-release: 'v3.1.4'

      - name: Sign container image
        id: sign-image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          # https://github.com/containers/container-libs/issues/388
          # https://github.com/coreos/rpm-ostree/issues/5509
          # use old bundle format, so we can use newer cosign 3.X.X instead of 2.X.X
          cosign sign -y --new-bundle-format=false --use-signing-config=false --key env://COSIGN_PRIVATE_KEY "${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      # Keep the newest 90 package versions (~30 builds: each build pushes two
      # image manifests and one cosign signature) as rollback points, and delete
      # the rest. Versions are deleted oldest first, and an image is always
      # older than its signature, so a kept image never loses its signature.
      - name: Delete old image versions
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: ${{ env.IMAGE_NAME }}
          package-type: container
          min-versions-to-keep: 90
